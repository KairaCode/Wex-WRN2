# CPU checks of the repository: check_repo.py, the stdlib tests, the WEX1-3/WNR3 CPU check and the
# WEX4 tests (scripts/check_all.sh). No GPU, no model weights, no secrets.
name: CI

on:
  # main only: a branch of this repository is checked through its pull request; push and pull_request
  # together would run every check twice for it
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # any other branch, by hand
    inputs:
      linux_io_bench:
        description: "Also run the full bench/wex_io.py (Linux read paths; a measurement, not a check)"
        type: boolean
        default: false

permissions:
  contents: read

# a newer push to the same branch or PR makes the running checks moot
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # a green run takes about 2 minutes; the default lets a hung test hold the runner for 6 hours
    env:
      PYTHON: python3
      USER: ""        # check_repo.py's user-name pattern reads USERNAME/USER; "runner" would match prose
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false   # the checks never talk to the remote: keep the token out of .git/config
      - name: All CPU checks
        run: bash scripts/check_all.sh
      # seconds: a 10 MB container, every read path of bench/wex_io.c checked against the index's SHA-256 and
      # run once. It shows that the benchmark still builds and reads right, not how fast anything is
      - name: Linux read-path benchmark, smoke run
        run: python3 -I bench/wex_io.py --dir "$RUNNER_TEMP" --smoke

  # the same checks on a 64-bit ARM CPU: no AVX2, so wex4/build_and_test.sh builds the scalar kernel of the fast
  # WNR3 decoder, and plain char is unsigned there
  linux-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: All CPU checks
        run: bash scripts/check_all.sh

  windows:
    runs-on: windows-2022
    timeout-minutes: 15   # a green run takes 3 to 5.5 minutes
    env:
      USER: ""
      USERNAME: ""
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: false
          # the action already caches the downloaded packages (cache: true is its default); the time left is
          # unpacking them, so the list is short. no MSYS2 git: it brings perl and openssh, 41 packages of 79
          # libgomp.a ships in its own package in current MSYS2; without it -fopenmp links fail
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libgomp mingw-w64-ucrt-x86_64-python
      - name: All CPU checks
        # check_repo.py calls git: the runner's Git for Windows, which made the checkout. only its folder is
        # appended, so nothing else of the Windows PATH reaches the MSYS2 shell (path-type stays minimal)
        run: |
          export PATH="$PATH:/c/Program Files/Git/cmd"
          bash scripts/check_all.sh

  # the same checks with every C file they build compiled under AddressSanitizer and UndefinedBehaviorSanitizer: an out-of-bounds
  # read or write, a use after free or undefined behaviour in a reader, a decoder or the in-process fuzzer stops
  # the run with a report. The tests load the instrumented libraries into Python (ctypes), which is not
  # instrumented, so the ASan runtime is preloaded; leak detection is off (the Python interpreter and gcc itself
  # do not free everything at exit)
  linux-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # an estimate: the fuzz runs are expected to be several times slower under the sanitizers
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
      WEX_CFLAGS: -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: All CPU checks under ASan and UBSan
        run: |
          LD_PRELOAD=$(gcc -print-file-name=libasan.so)
          export LD_PRELOAD
          bash scripts/check_all.sh
      # bench/wex_io.py appends WEX_CFLAGS too: its pread and io_uring paths under the sanitizers
      - name: Linux read-path benchmark, smoke run under ASan and UBSan
        run: python3 -I bench/wex_io.py --dir "$RUNNER_TEMP" --smoke

  # A measurement, not a check: the full bench/wex_io.py, only when a manual run asks for it
  # (gh workflow run ci.yml --ref <branch> -f linux_io_bench=true). The runner is a shared cloud VM with a
  # virtual disk: its numbers say how the read paths compare there, not what an NVMe drive gives. The table
  # goes to the job summary, every pass to the log (bench/out/wex_io.json)
  linux-io-bench:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_io_bench
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Linux read paths (bench/wex_io.py)
        run: |
          python3 -I bench/wex_io.py --dir "$RUNNER_TEMP" --drop-caches
          jq -r .table_markdown bench/out/wex_io.json >> "$GITHUB_STEP_SUMMARY"
          echo "----- bench/out/wex_io.json"
          cat bench/out/wex_io.json
