# CPU checks of the repository: check_repo.py, the stdlib tests, the WEX1-3/WNR3 CPU check, the WEX4 tests and
# the fast decoder's harness on synthetic records (scripts/check_all.sh), then the fuzzing harnesses replayed on
# their seeds (wex4/fuzz/run.sh --replay), on Linux (x86-64, ARM64), macOS (Apple silicon) and Windows, and on
# macOS once more with Apple clang (macos-clang). The same under ASan and UBSan on x86-64 Linux, on ARM64 Linux and
# with Apple clang on macOS (linux-sanitizers, linux-arm-sanitizers, macos-clang); the C test executables under
# TSan and MSan with clang, and the libraries of the Python tests under both (linux-tsan, linux-msan); the Go reader and writer on the conformance vectors and against the
# reference readers (go-reader); and the Rust reader on the conformance vectors and against the C and the Python
# reader (rust-reader).
# No GPU, no model weights, no secrets. A run started by hand can also have the linux-vulkan job (the WNR3 Vulkan
# prototype on a CPU Vulkan device) and the colibri-headers job (the engine fuzzing harnesses built against
# colibri's own headers).
# With the input linux_io_bench it also has the linux-io-bench job (the full Linux read-path benchmark).
# With the input arm_speed it also has the arm-speed jobs (the fast WNR3 decoder's speed on ARM64 Linux and macOS).
# With the input macos_io_bench it also has the macos-io-bench job (the full read-path benchmark on macOS).
# With the input vulkan_newmesa it also has the linux-vulkan-newmesa jobs (linux-vulkan on a newer Mesa, in containers).
name: CI

on:
  # main only: a branch of this repository is checked through its pull request; push and pull_request
  # together would run every check twice for it
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # any other branch, by hand
    inputs:
      linux_io_bench:
        description: "Also run the full bench/wex_io.py (Linux read paths; a measurement, not a check)"
        type: boolean
        default: false
      arm_speed:
        description: "Also run synth.sh speed of the fast decoder on ARM64 Linux and macOS (a measurement, not a check)"
        type: boolean
        default: false
      macos_io_bench:
        description: "Also run the full bench/wex_io.py on macos-15 (macOS read paths; a measurement, not a check)"
        type: boolean
        default: false
      vulkan_newmesa:
        description: "Also run the Vulkan prototype and its crash probe on a newer Mesa (containers: archlinux, fedora)"
        type: boolean
        default: false

permissions:
  contents: read

# a newer push to the same branch or PR makes the running checks moot. Runs started by hand are in groups of
# their own (one for each choice of linux_io_bench, arm_speed, macos_io_bench and vulkan_newmesa), so a push does not cancel a
# benchmark that is running and a run started by hand does not cancel the push run of its branch
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.linux_io_bench }}-${{ github.event.inputs.arm_speed }}-${{ github.event.inputs.macos_io_bench }}-${{ github.event.inputs.vulkan_newmesa }}
  cancel-in-progress: true

jobs:
  # Fast path classification (~6s, pure git, zero third-party actions): push to main and manual runs always run the
  # full matrix; pull requests that touch only docs, libwex, Go or Rust skip unrelated heavy sanitizer/QEMU jobs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      libwex: ${{ steps.filter.outputs.libwex }}
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: filter
        name: Classify changed paths
        run: |
          has_libwex=false
          [ -f libwex/scripts/test_libwex.sh ] && has_libwex=true
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "libwex=$has_libwex" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }}: full matrix (libwex=$has_libwex)"
            exit 0
          fi
          if ! git rev-parse --verify -q HEAD^2 > /dev/null; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "libwex=$has_libwex" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "non-merge PR checkout: full matrix (fail-open)"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$changed"
          core=false; libwex=false; go=false; rust=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*|charts/*|research/*|*.md|LICENSE|NOTICE|THIRD_PARTY_NOTICES.md)
                ;;
              libwex/*)
                libwex=$has_libwex
                ;;
              impl/go-wex4/testdata/*)
                core=true; go=true; rust=true
                ;;
              impl/go-wex4/*)
                go=true
                ;;
              impl/rust-wex4/*)
                rust=true
                ;;
              *)
                core=true; go=true; rust=true; libwex=$has_libwex
                ;;
            esac
          done <<< "$changed"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "libwex=$libwex" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "Selected: core=$core libwex=$libwex go=$go rust=$rust"

  # Runs on every PR/push (~15s): validates all Markdown links, anchors, sync-map, SPDX headers, and privacy patterns.
  repo-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Repository checks (links, mirror, licence, privacy)
        run: |
          python3 -I check_repo.py --self-test
          python3 -I check_repo.py

  linux:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON: python3
      USER: ""        # check_repo.py's user-name pattern reads USERNAME/USER; "runner" would match prose
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false   # the checks never talk to the remote: keep the token out of .git/config
      - name: All CPU checks
        run: bash scripts/check_all.sh
      # the fast decoder's harness built once for each value of -DWEX_FAST_LANES (the streams of the default entry
      # point), each compared with the reference decoder on the synthetic records that the step above wrote
      - name: Fast decoder, every WEX_FAST_LANES (AVX2 kernels)
        run: bash wex4/research/fast-cpu-decode/synth.sh lanes
      # the fuzzing harnesses of wex4/fuzz/ built with gcc: every seed once and the custom mutators on the seeds,
      # with a deterministic stand-in for libFuzzer's mutation. No coverage guidance: that is the Fuzz workflow
      - name: Fuzz harnesses, seeds and mutators replayed
        run: bash wex4/fuzz/run.sh --replay
      # the harness of the CUDA decoder built for the CPU (fuzz_wnr3_cuda) against 23 copies of the CUDA source,
      # each with one check, wait or barrier broken: the replay must fail on every copy
      - name: Negative control of the CUDA decoder's harness
        run: python3 -I wex4/fuzz/cuda_negative.py
      # its GPU mode built, not run (the runner has no GPU): clang writes the PTX of c/wex_cuda.cuh without the
      # CUDA toolkit, and the harness that would load it through the driver library builds with gcc
      - name: GPU mode of the CUDA decoder's harness, built only
        run: WEX_FUZZ_GPU_BUILD_ONLY=1 bash wex4/fuzz/run.sh --gpu
      # seconds: a 10 MB container, every read path of bench/wex_io.c checked against the index's SHA-256 and
      # run once. It shows that the benchmark still builds and reads right, not how fast anything is.
      # --strict: all 27 paths run on this runner, so a path that reports "skipped" (O_DIRECT or io_uring
      # set-up broken) fails the step. The second call reads the container the first one left (--file)
      - name: Linux read-path benchmark, smoke run
        run: |
          python3 -I bench/wex_io.py --dir "$RUNNER_TEMP" --smoke --strict --keep
          python3 -I bench/wex_io.py --file "$RUNNER_TEMP/wex-io-bench.wex4" --smoke --strict

  # 64-bit ARM CPU checks (NEON + scalar + clang). Split from linux-arm-sve so NEON and SVE/QEMU run in parallel.
  linux-arm:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: All CPU checks (NEON kernel of the fast decoder)
        run: |
          set -o pipefail
          bash scripts/check_all.sh | tee "$RUNNER_TEMP/check.log"
          grep -q '^fast WNR3 decoder of wex4_tools.dll: NEON kernels$' "$RUNNER_TEMP/check.log"
          grep -q '^build: NEON kernels' "$RUNNER_TEMP/check.log"
      # the replay prints which kernel of the fast WNR3 decoder it built: the step fails unless it is NEON
      - name: Fuzz harnesses, seeds and mutators replayed (NEON kernel of the fast decoder)
        run: |
          set -o pipefail
          bash wex4/fuzz/run.sh --replay | tee "$RUNNER_TEMP/replay.log"
          grep -q '^fast WNR3 decoder of fuzz_wnr3_record: NEON kernels$' "$RUNNER_TEMP/replay.log"
      - name: Linux read-path benchmark, smoke run
        run: python3 -I bench/wex_io.py --dir "$RUNNER_TEMP" --smoke --strict
      - name: WEX4 tests with the scalar kernel forced
        run: |
          set -o pipefail
          WEX4_MARCH=-DWEX_FAST_SCALAR bash wex4/build_and_test.sh | tee "$RUNNER_TEMP/scalar.log"
          grep -q '^fast WNR3 decoder of wex4_tools.dll: scalar kernels$' "$RUNNER_TEMP/scalar.log"
      - name: Speed of the NEON kernel and of the scalar kernel (printed only)
        run: |
          bash wex4/research/fast-cpu-decode/synth.sh speed 21
          cd wex4/research/fast-cpu-decode/out/synth
          ./t_simd.exe bench model.wnm2 15 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec
      - name: Fast decoder, every WEX_FAST_LANES (NEON kernel)
        run: bash wex4/research/fast-cpu-decode/synth.sh lanes
      # the two steps below use the records and the model that synth.sh left in out/synth
      - name: Negative controls of the mutation test (NEON build)
        run: |
          cd wex4/research/fast-cpu-decode/out/synth
          bash ../../negative_control.sh model.wnm2 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec
      - name: clang build of the harness (NEON kernel, no OpenMP)
        run: |
          set -o pipefail
          clang --version
          cd wex4/research/fast-cpu-decode/out/synth
          clang -std=c11 -Wall -Wextra -Werror -Wno-unused-function -O3 -I../../../../../c -I../.. ../../test_fast_decode.c -o t_clang.exe
          ./t_clang.exe equal model.wnm2 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec | tee "$RUNNER_TEMP/clang.log"
          grep -q '^build: NEON kernels' "$RUNNER_TEMP/clang.log"
          ./t_clang.exe mutate model.wnm2 600 20261114 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec

  # SVE kernel 2 (gathers) on ARM64 + QEMU user-mode emulation at 256-, 512- and 2048-bit vector lengths.
  linux-arm-sve:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: SVE build, WEX4 tests and fuzz replay (kernel 1)
        run: |
          set -o pipefail
          grep -m1 '^Features' /proc/cpuinfo | grep -o -w -E 'sve|sve2' | tr '\n' ' '; echo
          WEX4_MARCH=-march=armv8-a+sve bash wex4/build_and_test.sh | tee "$RUNNER_TEMP/sve-wex4.log"
          grep -q '^fast WNR3 decoder of wex4_tools.dll: NEON+SVE kernels$' "$RUNNER_TEMP/sve-wex4.log"
          WEX_CFLAGS=-march=armv8-a+sve bash wex4/fuzz/run.sh --replay | tee "$RUNNER_TEMP/sve-replay.log"
          grep -q '^fast WNR3 decoder of fuzz_wnr3_record: NEON+SVE kernels$' "$RUNNER_TEMP/sve-replay.log"
      - name: SVE build, harness on the synthetic records (kernel 2 with gathers)
        env:
          WEX4_MARCH: -march=armv8-a+sve
        run: |
          set -o pipefail
          bash wex4/research/fast-cpu-decode/synth.sh check | tee "$RUNNER_TEMP/sve.log"
          grep -q '^build: NEON+SVE kernels' "$RUNNER_TEMP/sve.log"
          grep '^SVE vector length' "$RUNNER_TEMP/sve.log"
      - name: Speed of the SVE build, kernels 0, 1 and 2 (printed only)
        env:
          WEX4_MARCH: -march=armv8-a+sve
        run: |
          bash wex4/research/fast-cpu-decode/synth.sh speed 21
          cd wex4/research/fast-cpu-decode/out/synth
          ./t_simd.exe bench model.wnm2 15 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec
      - name: Negative controls of the mutation test (SVE build)
        env:
          WEX4_MARCH: -march=armv8-a+sve
        run: |
          set -o pipefail
          cd wex4/research/fast-cpu-decode/out/synth
          bash ../../negative_control.sh model.wnm2 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec | tee "$RUNNER_TEMP/sve-neg.log"
          [ "$(grep -c '(SVE kernel 2.*: caught$' "$RUNNER_TEMP/sve-neg.log")" = 3 ]
      - name: clang build of the harness (SVE build, no OpenMP)
        run: |
          set -o pipefail
          cd wex4/research/fast-cpu-decode/out/synth
          clang -std=c11 -Wall -Wextra -Werror -Wno-unused-function -O3 -march=armv8-a+sve -I../../../../../c -I../.. ../../test_fast_decode.c -o t_clang_sve.exe
          ./t_clang_sve.exe equal model.wnm2 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec | tee "$RUNNER_TEMP/clang-sve.log"
          grep -q '^build: NEON+SVE kernels' "$RUNNER_TEMP/clang-sve.log"
          ./t_clang_sve.exe mutate model.wnm2 600 20261114 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec
      - name: SVE build at other vector lengths (QEMU user-mode emulation)
        run: |
          set -o pipefail
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          qemu-aarch64 --version | head -1
          cd wex4/research/fast-cpu-decode/out/synth
          for bytes in 32 64 256; do
            Q="qemu-aarch64 -cpu max,sve-default-vector-length=$bytes"
            $Q ./t_simd.exe equal model.wnm2 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec | tee "$RUNNER_TEMP/qemu.log"
            grep -q "^SVE vector length: $((bytes * 8)) bits" "$RUNNER_TEMP/qemu.log"
            $Q ./t_simd.exe mutate model.wnm2 200 20261115 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec
          done
      - name: SVE build, which kernel 2 groups the checks reach (128 bits on the CPU, 3 lengths under QEMU)
        run: |
          set -o pipefail
          cd wex4/research/fast-cpu-decode/out/synth
          R=$RUNNER_TEMP/reach
          for g in 1 2 3; do
            mkdir -p "$R/g$g"
            if [ $g = 3 ]; then f='default'; else f="case $((2 * g + 1))"; fi
            sed -e "s/^        case $((2 * g)): return wexf_weights_sve(J, s, $g, 0);/        case $((2 * g)): return -1;/" \
                -e "s/^        $f: return wexf_weights_sve(J, s, $g, 1);/        $f: return -1;/" ../../wex_fast_decode.h > "$R/g$g/wex_fast_decode.h"
            [ "$(grep -c -E '^        (case [0-9]+|default): return -1;$' "$R/g$g/wex_fast_decode.h")" = 2 ]
            cp ../../test_fast_decode.c "$R/g$g/"
            gcc -std=c11 -O3 -march=armv8-a+sve -fopenmp -I../../../../../c "$R/g$g/test_fast_decode.c" -o "$R/g$g/t.exe" &
          done
          wait
          fail=0
          for bytes in 16 32 64 256; do
            if [ $bytes = 16 ]; then Q=; else Q="qemu-aarch64 -cpu max,sve-default-vector-length=$bytes"; fi
            for g in 1 2 3; do
              $Q "$R/g$g/t.exe" equal model.wnm2 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec > "$R/equal.log" 2>&1 || true
              grep -q "^SVE vector length: $((bytes * 8)) bits" "$R/equal.log"
              e=$(grep -c 'MISMATCH k2: SVE gather' "$R/equal.log" || true)
              $Q "$R/g$g/t.exe" mutate model.wnm2 200 20261115 L0_E0.rec L0_E1.rec L0_E2.rec L0_E3.rec > "$R/mutate.log" 2>&1 || true
              if grep -q '^MISMATCH.*SVE gather' "$R/mutate.log"; then m=reached; else m='not reached'; fi
              echo "$((bytes * 8)) bits, $g-vector groups: equal $e mismatching decodes, mutate $m"
              if [ $bytes = 256 ] && [ $g -gt 1 ]; then [ "$e" = 0 ] || fail=1; else [ "$e" != 0 ] || fail=1; fi
              if [ $bytes != 256 ] || [ $g -lt 3 ]; then [ "$m" = reached ] || fail=1; fi
            done
          done
          exit $fail

  macos:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: All CPU checks (NEON kernel of the fast decoder)
        run: |
          CC=$(ls "$(brew --prefix)"/bin/gcc-[0-9]* | sort -t- -k2 -n | tail -1)
          export CC
          echo "CC=$CC" >> "$GITHUB_ENV"   # the steps below build with the same compiler
          uname -sm; getconf PAGESIZE; "$CC" --version | head -1; "$PYTHON" --version
          set -o pipefail
          bash scripts/check_all.sh | tee "$RUNNER_TEMP/check.log"
          grep -q '^fast WNR3 decoder of wex4_tools.dll: NEON kernels$' "$RUNNER_TEMP/check.log"
          grep -q '^build: NEON kernels' "$RUNNER_TEMP/check.log"
      - name: macOS read-path benchmark, smoke run (GNU gcc, then Apple clang)
        run: |
          "$CC" --version | head -1; clang --version | head -1
          WEX_CFLAGS="-std=c99 -pedantic" python3 -I bench/wex_io.py --dir "$RUNNER_TEMP" --smoke --strict --keep
          CC=clang WEX_CFLAGS="-std=c99 -pedantic" python3 -I bench/wex_io.py --file "$RUNNER_TEMP/wex-io-bench.wex4" --smoke --strict
      - name: Fuzz harnesses, seeds and mutators replayed (NEON kernel of the fast decoder)
        run: |
          set -o pipefail
          bash wex4/fuzz/run.sh --replay | tee "$RUNNER_TEMP/replay.log"
          grep -q '^fast WNR3 decoder of fuzz_wnr3_record: NEON kernels$' "$RUNNER_TEMP/replay.log"

  # Apple clang + libomp normal checks (split from macos-clang-sanitizers so normal & ASan/UBSan run in parallel).
  macos-clang:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
      CC: clang
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: OpenMP runtime for Apple clang (libomp of Homebrew)
        run: |
          brew list libomp > /dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install libomp
          P=$(brew --prefix libomp)
          echo "WEX_OPENMP=-Xclang -fopenmp -I$P/include -L$P/lib -lomp -Wno-unused-command-line-argument" >> "$GITHUB_ENV"
          uname -sm; clang --version | head -1; brew list --versions libomp; "$PYTHON" --version
      - name: All CPU checks (Apple clang, libomp, NEON kernel of the fast decoder)
        run: |
          set -o pipefail
          bash scripts/check_all.sh | tee "$RUNNER_TEMP/check.log"
          grep -q '^fast WNR3 decoder of wex4_tools.dll: NEON kernels$' "$RUNNER_TEMP/check.log"
          grep -q '^build: NEON kernels, OpenMP;' "$RUNNER_TEMP/check.log"
          test "$(grep -c '^compiler: Apple clang' "$RUNNER_TEMP/check.log")" = 4
      - name: Fuzz harnesses, seeds and mutators replayed (Apple clang)
        run: |
          set -o pipefail
          bash wex4/fuzz/run.sh --replay | tee "$RUNNER_TEMP/replay.log"
          grep -q '^compiler: Apple clang' "$RUNNER_TEMP/replay.log"
          grep -q '^fast WNR3 decoder of fuzz_wnr3_record: NEON kernels$' "$RUNNER_TEMP/replay.log"

  macos-clang-sanitizers:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
      CC: clang
      WEX_CFLAGS: -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: OpenMP runtime for Apple clang (libomp of Homebrew)
        run: |
          brew list libomp > /dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install libomp
          P=$(brew --prefix libomp)
          echo "WEX_OPENMP=-Xclang -fopenmp -I$P/include -L$P/lib -lomp -Wno-unused-command-line-argument" >> "$GITHUB_ENV"
      - name: Fuzz harnesses, seeds and mutators replayed under ASan and UBSan (NEON kernel of the fast decoder)
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:fast_unwind_on_malloc=1:malloc_context_size=5
        run: |
          set -o pipefail
          bash wex4/fuzz/run.sh --replay | tee "$RUNNER_TEMP/replay-asan.log"
          grep -q '^fast WNR3 decoder of fuzz_wnr3_record: NEON kernels$' "$RUNNER_TEMP/replay-asan.log"
      - name: All CPU checks under ASan and UBSan (NEON kernel of the fast decoder)
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strip_env=0:fast_unwind_on_malloc=1:malloc_context_size=5
        run: |
          ASAN_LIB=$(clang -print-resource-dir)/lib/darwin/libclang_rt.asan_osx_dynamic.dylib
          test -f "$ASAN_LIB"
          printf '#!/bin/bash\nDYLD_INSERT_LIBRARIES="%s" exec "%s" "$@"\n' "$ASAN_LIB" "$(command -v "$PYTHON")" > "$RUNNER_TEMP/python-asan"
          chmod +x "$RUNNER_TEMP/python-asan"
          set -o pipefail
          PYTHON=$RUNNER_TEMP/python-asan bash scripts/check_all.sh | tee "$RUNNER_TEMP/asan.log"
          grep -q '^fast WNR3 decoder of wex4_tools.dll: NEON kernels$' "$RUNNER_TEMP/asan.log"
          grep -q '^build: NEON kernels, OpenMP;' "$RUNNER_TEMP/asan.log"

  windows:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      USER: ""
      USERNAME: ""
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libgomp mingw-w64-ucrt-x86_64-python
      - name: All CPU checks
        run: |
          export PATH="$PATH:/c/Program Files/Git/cmd"
          bash scripts/check_all.sh
      - name: Fuzz harnesses, seeds and mutators replayed
        run: bash wex4/fuzz/run.sh --replay
      - name: Hardware benchmark (bench.py), quick run
        run: |
          set -e
          python bench/bench.py --dir "$RUNNER_TEMP" --quick --skip h2d,wex_check
          cat bench/out/results.json
          python -I -c "import json; r = json.load(open('bench/out/results.json')); s, d = r['sysinfo'], r['disk']; assert s['cpu'] and s['cpu_avx2'] and s['MemTotal'] and s['test_fs']['type'] and r['ram_bw']['read_gbs_all'] > 0 and all(d[k][p]['o_direct'] and d[k][p]['gbs'] > 0 for k in ('seq_8mib', 'rand_1mib', 'rand_18mib') for p in ('first', 'second')), r"
          PATH="/c/Windows/System32:$PATH" python -I -c "import sys; sys.path.insert(0, 'bench'); import bench; c = []; bench.sh = lambda cmd, **k: (c.append(cmd), (0, 'all checks passed', ''))[1]; r = bench.wex_check(); print(c); assert r['passed'] and c and c[0][0] == bench.find_bash() and 'system32' not in c[0][0].lower(), c"
          python bench/bench.py --dir "$RUNNER_TEMP" --file "$RUNNER_TEMP/no-such-file" --skip ram_bw,h2d,wex_check
          grep -q '<FILE>' bench/out/results.json
          ! grep -n -i -e 'users[\\/]' -e 'runneradmin' bench/out/results.json

  linux-sanitizers:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
      WEX_CFLAGS: -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:fast_unwind_on_malloc=1:malloc_context_size=5
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: All CPU checks under ASan and UBSan
        run: |
          LD_PRELOAD=$(gcc -print-file-name=libasan.so)
          export LD_PRELOAD
          bash scripts/check_all.sh
      - name: Fuzz harnesses, seeds and mutators replayed under ASan and UBSan
        run: bash wex4/fuzz/run.sh --replay
      - name: Linux read-path benchmark, smoke run under ASan and UBSan
        run: python3 -I bench/wex_io.py --dir "$RUNNER_TEMP" --smoke --strict

  # ARM64 ASan+UBSan split into two parallel jobs (checks vs fuzz replay) with fast frame-pointer malloc unwind.
  linux-arm-sanitizers:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
      WEX_CFLAGS: -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:fast_unwind_on_malloc=1:malloc_context_size=5
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: All CPU checks under ASan and UBSan (NEON kernel of the fast decoder)
        run: |
          LD_PRELOAD=$(gcc -print-file-name=libasan.so)
          export LD_PRELOAD
          set -o pipefail
          bash scripts/check_all.sh | tee "$RUNNER_TEMP/check.log"
          grep -q '^fast WNR3 decoder of wex4_tools.dll: NEON kernels$' "$RUNNER_TEMP/check.log"
          grep -q '^build: NEON kernels' "$RUNNER_TEMP/check.log"
      - name: Linux read-path benchmark, smoke run under ASan and UBSan
        run: python3 -I bench/wex_io.py --dir "$RUNNER_TEMP" --smoke --strict

  linux-arm-sanitizers-replay:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
      WEX_CFLAGS: -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:fast_unwind_on_malloc=1:malloc_context_size=5
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Fuzz harnesses, seeds and mutators replayed under ASan and UBSan (NEON kernel of the fast decoder)
        run: |
          set -o pipefail
          bash wex4/fuzz/run.sh --replay | tee "$RUNNER_TEMP/replay.log"
          grep -q '^fast WNR3 decoder of fuzz_wnr3_record: NEON kernels$' "$RUNNER_TEMP/replay.log"

  linux-tsan:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: OpenMP runtime of the installed clang
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "libomp-$(clang -dumpversion | cut -d. -f1)-dev"
      - name: C tests and the libraries of the Python tests under ThreadSanitizer
        run: bash scripts/sanitize_c.sh tsan
      - name: Linux read-path benchmark, smoke run under ThreadSanitizer
        run: CC=clang WEX_CFLAGS="-g -fsanitize=thread" python3 -I bench/wex_io.py --dir "$RUNNER_TEMP" --smoke --strict

  linux-clang:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: OpenMP runtime of the installed clang
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "libomp-$(clang -dumpversion | cut -d. -f1)-dev"
      - name: All CPU checks built with clang
        run: |
          set -o pipefail
          CC=clang bash scripts/check_all.sh | tee "$RUNNER_TEMP/clang.log"
          grep '^compiler: ' "$RUNNER_TEMP/clang.log"
          test "$(grep -c '^compiler: ' "$RUNNER_TEMP/clang.log")" = 4
          test "$(grep -c '^compiler: .*clang' "$RUNNER_TEMP/clang.log")" = 4

  linux-msan:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON: python3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: C tests and the libraries of the Python tests under MemorySanitizer
        run: bash scripts/sanitize_c.sh msan

  go-reader:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Go reader and writer, against the conformance vectors and the reference readers
        env:
          WEX4_NEED_REFERENCE: "1"
        run: bash impl/go-wex4/run.sh

  rust-reader:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Rust reader on the conformance vectors
        run: bash impl/rust-wex4/run.sh
      - name: The C and the Python reader (wex4/out)
        run: bash wex4/build_and_test.sh --fuzz 10
      - name: The Go reader, for the codec-8 comparison
        run: cd impl/go-wex4 && go build -o out/wex4check .
      - name: Rust reader against the C and the Python reader, hand-made and 7,000 mutated files; codec 8 against the manifest, the C reader's hashes and the Go reader, 2,000 mutated files
        run: python3 -I impl/rust-wex4/differential.py --count 7000 --wnr4-count 2000 --go impl/go-wex4/out/wex4check impl/rust-wex4/out/target/release/wex4r "$RUNNER_TEMP/differential"

  # Dedicated fast cross-platform libwex SDK matrix (runs when libwex/scripts/test_libwex.sh is present and touched).
  libwex:
    needs: changes
    if: needs.changes.outputs.libwex == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      USER: ""
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - if: matrix.os == 'windows-2022'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - if: matrix.os == 'windows-2022'
        name: libwex SDK tests (Windows MSYS2 UCRT64)
        shell: msys2 {0}
        run: bash libwex/scripts/test_libwex.sh
      - if: matrix.os != 'windows-2022'
        name: libwex SDK tests (POSIX)
        env:
          PYTHON: python3
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            CC=$(ls "$(brew --prefix)"/bin/gcc-[0-9]* | sort -t- -k2 -n | tail -1)
            export CC
          fi
          bash libwex/scripts/test_libwex.sh

  # A measurement, not a check: the full bench/wex_io.py, only when a manual run asks for it
  # (gh workflow run ci.yml --ref <branch> -f linux_io_bench=true). The runner is a shared cloud VM with a
  # virtual disk: its numbers say how the read paths compare there, not what an NVMe drive gives. The table
  # goes to the job summary, every pass to the log (bench/out/wex_io.json)
  linux-io-bench:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_io_bench
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Linux read paths (bench/wex_io.py)
        run: |
          python3 -I bench/wex_io.py --dir "$RUNNER_TEMP" --drop-caches
          jq -r .table_markdown bench/out/wex_io.json >> "$GITHUB_STEP_SUMMARY"
          echo "----- bench/out/wex_io.json"
          cat bench/out/wex_io.json

  # A measurement, not a check: the speed of the fast WNR3 decoder's NEON kernel for every number of interleaved
  # streams of kernel 1 (the rows of synth.sh speed), only when a manual run asks for it
  # (gh workflow run ci.yml --ref <branch> -f arm_speed=true). Three jobs per runner image, so three virtual
  # machines of each. On each: synth.sh lanes compares every -DWEX_FAST_LANES with the reference decoder, then
  # synth.sh speed runs 3 times per compiler, the compilers taking turns: gcc on Linux; on macOS the newest
  # Homebrew GNU gcc of the image and Apple clang with the libomp of Homebrew (WEX_OPENMP). Shared VMs and the
  # synthetic records of wex4/build_and_test.sh: the numbers compare stream counts and compilers on these
  # runners, not the speed of a real record. speed_runs.py puts median and spread in the job summary
  arm-speed:
    if: github.event_name == 'workflow_dispatch' && inputs.arm_speed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
        vm: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30   # the jobs took 2 to 6 minutes on 2026-11-15, and 2.5 to 5 on 2026-11-16 (run 43811647711)
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Runner image, CPU and compilers
        run: |
          echo "runner image: ${ImageOS-?} ${ImageVersion-?}"
          uname -sm; getconf _NPROCESSORS_ONLN
          if [ "$(uname -s)" = Darwin ]; then
            sysctl machdep.cpu.brand_string hw.model hw.ncpu hw.memsize
            GCC=$(ls "$(brew --prefix)"/bin/gcc-[0-9]* | sort -t- -k2 -n | tail -1)
            brew list libomp > /dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install libomp
            brew list --versions libomp
            P=$(brew --prefix libomp)
            echo "CLANG_OPENMP=-Xclang -fopenmp -I$P/include -L$P/lib -lomp" >> "$GITHUB_ENV"
            echo "COMPILERS=$GCC clang" >> "$GITHUB_ENV"
          else
            lscpu
            GCC=gcc
            echo "COMPILERS=gcc" >> "$GITHUB_ENV"
          fi
          echo "GCC=$GCC" >> "$GITHUB_ENV"
      - name: Synthetic records (wex4/build_and_test.sh with GNU gcc)
        run: CC=$GCC bash wex4/build_and_test.sh
      # -Werror: a compiler warning fails the step. Each build must be the NEON one with OpenMP, and on macOS the
      # clang must be Apple clang
      - name: Every WEX_FAST_LANES against the reference decoder, each compiler
        run: |
          set -o pipefail
          for c in $COMPILERS; do
            if [ "$c" = clang ]; then export WEX_OPENMP="$CLANG_OPENMP"; else unset WEX_OPENMP; fi
            CC=$c WEX_CFLAGS=-Werror bash wex4/research/fast-cpu-decode/synth.sh lanes | tee "$RUNNER_TEMP/lanes.log"
            test "$(grep -c '^build: NEON kernels, OpenMP' "$RUNNER_TEMP/lanes.log")" = 12
            if [ "$c" = clang ]; then grep -q '^compiler: Apple clang' "$RUNNER_TEMP/lanes.log"; fi
          done
      - name: synth.sh speed, 3 runs per compiler (printed, never judged)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/speed"
          for i in 1 2 3; do
            for c in $COMPILERS; do
              if [ "$c" = clang ]; then export WEX_OPENMP="$CLANG_OPENMP"; else unset WEX_OPENMP; fi
              CC=$c bash wex4/research/fast-cpu-decode/synth.sh speed 21 | tee "$RUNNER_TEMP/speed/$(basename "$c")-$i.log"
            done
          done
          for c in $COMPILERS; do
            n=$(basename "$c")
            echo "----- $n: median and spread of the 3 runs"
            { echo "### ${{ matrix.os }}, VM ${{ matrix.vm }}, $n"; echo; } >> "$GITHUB_STEP_SUMMARY"
            python3 -I wex4/research/fast-cpu-decode/speed_runs.py "$RUNNER_TEMP"/speed/"$n"-*.log | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # The measurement of linux-io-bench on macOS, only when a manual run asks for it
  # (gh workflow run ci.yml --ref <branch> -f macos_io_bench=true). The runner is a virtual machine on an Apple
  # silicon host with a virtual disk: its numbers say how the macOS read paths compare there, not what the SSD
  # of a Mac gives. The compiler is the runner's default gcc, which is Apple clang, in C99. --drop-caches runs
  # purge through sudo before every pass; it empties the cache of the VM's kernel, not a cache of the host under
  # the virtual disk. --runs 17: the order of the 17 timed paths (the 27 rows of wex_io.py but the 10 that macOS
  # has not) rotates by one each round, so with 17 rounds every path takes every place in a round once (on these
  # runners the early places of a round are slower). The recorded runs of 2026-11-15 had 11 paths and --runs 11.
  # The first lines say whether sudo needs no password, and what the VM is
  macos-io-bench:
    if: github.event_name == 'workflow_dispatch' && inputs.macos_io_bench
    runs-on: macos-15
    timeout-minutes: 60   # with --runs 17 a green run took 9.7 minutes (run 43811647711, 2026-11-16, one run; that job was green, the run's rollup was failure)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: macOS read paths (bench/wex_io.py)
        run: |
          if sudo -n true; then echo "sudo without a password: yes"; else echo "sudo without a password: no"; fi
          sysctl -n machdep.cpu.brand_string hw.model kern.hv_vmm_present hw.memsize hw.pagesize
          sw_vers; gcc --version | head -1; df -h "$RUNNER_TEMP"
          WEX_CFLAGS="-std=c99 -pedantic" python3 -I bench/wex_io.py --dir "$RUNNER_TEMP" --drop-caches --runs 17
          jq -r .table_markdown bench/out/wex_io.json >> "$GITHUB_STEP_SUMMARY"
          echo "----- bench/out/wex_io.json"
          cat bench/out/wex_io.json

  # opt-in: only a run started by hand (workflow_dispatch) has this job. The WNR3 decode as a Vulkan compute
  # shader (wex4/research/vulkan-decode, docs/WNR3-VULKAN.md) against the CPU reference, on Mesa lavapipe: a
  # Vulkan device that runs on the runner's CPU. It checks that the shader decodes the right bytes and refuses
  # what the reference refuses; it says nothing about speed on a GPU
  linux-vulkan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      # spirv-tools and gdb only for the crash probe below
      - name: Vulkan headers, loader, shader compiler, lavapipe and the validation layer
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslang-tools mesa-vulkan-drivers vulkan-validationlayers \
              spirv-tools gdb
      - name: Containers with WNR3 records (wex4/out)
        run: bash wex4/build_and_test.sh --fuzz 10
      - name: WNR3 on Vulkan against the CPU reference, validation layer on
        run: WNR3_VK_VALIDATE=1 bash wex4/research/vulkan-decode/run.sh wex4/out/tiny_nr3_cz.wex4 wex4/out/synth.wex4
      # not a check, it ends with status 0 whatever it finds: which forms of the scale pass crash the runner's
      # llvmpipe (crash_probe.sh, issue 21). Its log is what the README reports under "The llvmpipe crash"
      - name: Probe of the llvmpipe crash (not a check)
        run: bash wex4/research/vulkan-decode/crash_probe.sh
      - name: Negative control (eleven broken shaders must fail)
        run: bash wex4/research/vulkan-decode/negative_control.sh wex4/out/tiny_nr3_cz.wex4 wex4/out/synth.wex4
      # the records of synth.wex4 behind 5 GiB of blobs: the host program must find them at 64-bit offsets
      - name: A file above 4 GiB
        run: |
          python3 -I wex4/research/vulkan-decode/big_file.py wex4/out/synth.wex4 "$RUNNER_TEMP/big.wex4"
          WNR3_VK_SHADERS=wex4/research/vulkan-decode/out wex4/research/vulkan-decode/out/wnr3_vk decode "$RUNNER_TEMP/big.wex4"
          rm -f "$RUNNER_TEMP/big.wex4"
      # last, because it rebuilds out/wnr3_vk: the host program under AddressSanitizer and UndefinedBehaviorSanitizer
      # (the Vulkan driver is not instrumented; leak detection is off, the driver keeps memory until exit)
      - name: The same checks with the host program under the sanitizers
        env:
          WEX_CFLAGS: -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: bash wex4/research/vulkan-decode/run.sh wex4/out/tiny_nr3_cz.wex4 wex4/out/synth.wex4

  # opt-in: only a run started by hand with the input vulkan_newmesa has this job
  # (gh workflow run ci.yml --ref <branch> -f vulkan_newmesa=true). The checks of linux-vulkan and its crash probe
  # (issue 21) on a newer Mesa than the runner's: in a container of a distribution that ships a newer Mesa
  # lavapipe, nothing taken from the runner's packages. The images are not pinned, so the Mesa and LLVM of a run
  # are the ones its first step prints. gdb needs ptrace in the container: SYS_PTRACE, no seccomp filter.
  # No sanitizer build and no 5 GiB file here: linux-vulkan has them
  linux-vulkan-newmesa:
    if: github.event_name == 'workflow_dispatch' && inputs.vulkan_newmesa
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "fedora:latest"]
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    timeout-minutes: 30
    env:
      PYTHON: python3
      USER: ""
      USERNAME: ""
      DEBUGINFOD_URLS: ""   # gdb: no symbol download from the network
    defaults:
      run:
        shell: bash
    steps:
      - name: Compiler, Python, Vulkan headers, loader, shader compiler, lavapipe, the validation layer, vulkaninfo
        run: |
          if command -v pacman > /dev/null; then
            pacman -Syu --noconfirm --needed git gcc python diffutils which vulkan-headers vulkan-icd-loader glslang \
                vulkan-swrast vulkan-validation-layers vulkan-tools spirv-tools gdb
            pacman -Q vulkan-swrast llvm-libs glslang spirv-tools vulkan-icd-loader
          else
            dnf install -y git gcc python3 diffutils which findutils vulkan-headers vulkan-loader-devel glslang \
                mesa-vulkan-drivers vulkan-validation-layers vulkan-tools spirv-tools gdb
            rpm -q mesa-vulkan-drivers llvm-libs glslang spirv-tools vulkan-loader
          fi
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          # lavapipe alone: the other Mesa drivers of the image find no device in the container, and the loader's
          # messages about them would count as messages of the validation layer
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "VK_DRIVER_FILES=$icd" | tee -a "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Vulkan device (Mesa and LLVM versions)
        run: |
          vulkaninfo --summary
          vulkaninfo --summary | grep -E 'deviceName|driverName|driverInfo|apiVersion' | sed 's/^ */device: /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Containers with WNR3 records (wex4/out)
        run: bash wex4/build_and_test.sh --fuzz 10
      - name: WNR3 on Vulkan against the CPU reference, validation layer on
        run: WNR3_VK_VALIDATE=1 bash wex4/research/vulkan-decode/run.sh wex4/out/tiny_nr3_cz.wex4 wex4/out/synth.wex4
      # not a check, it ends with status 0 whatever it finds
      - name: Probe of the llvmpipe crash (not a check)
        run: |
          set -o pipefail
          bash wex4/research/vulkan-decode/crash_probe.sh | tee "$RUNNER_TEMP/probe.log"
          grep -E '^(first, record|crash_min\.c, crash_min\.comp:|crash probe:)' "$RUNNER_TEMP/probe.log" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Negative control (eleven broken shaders must fail)
        run: bash wex4/research/vulkan-decode/negative_control.sh wex4/out/tiny_nr3_cz.wex4 wex4/out/synth.wex4

  # opt-in: only a run started by hand has this job, because it fetches a third-party repository. The fuzz replay,
  # then the two engine harnesses of wex4/fuzz/ built against the headers of colibri itself instead of the
  # stand-ins of wex4/fuzz/engine/ (WEX_FUZZ_COLIBRI=fetch: the c/*.h and c/expert_store_registry.c of the commit
  # that run.sh pins, with git, nothing copied into the repository), their seeds replayed, and the declarations of
  # both compared (engine_layout.c). Then the store's own test, c/tests/test_expert_store_wex.c, built against the
  # same files. On Linux and on macOS, where c/qwen38_wex.h opens files with colibri's compat_open_direct
  colibri-headers:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHON: python3
      WEX_FUZZ_COLIBRI: fetch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Fuzz replay, and the engine harnesses against colibri's headers
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            CC=$(ls "$(brew --prefix)"/bin/gcc-[0-9]* | sort -t- -k2 -n | tail -1)   # GNU gcc, as in the macos job
            export CC
            echo "CC=$CC" >> "$GITHUB_ENV"
          fi
          set -o pipefail
          bash wex4/fuzz/run.sh --replay | tee "$RUNNER_TEMP/replay.log"
          grep -q '^engine_layout: .* the same in the stand-ins and in the tree$' "$RUNNER_TEMP/replay.log"
          test "$(grep -c '^== fuzz_.*_wex, against the headers of ' "$RUNNER_TEMP/replay.log")" = 2
      - name: The store's own test against colibri's headers and backend registry
        run: |
          set -o pipefail
          bash scripts/build_cpu_check.sh wex4/fuzz/out/colibri/c | tee "$RUNNER_TEMP/store.log"
          grep -q '^ALL WEX STANDALONE TESTS PASSED$' "$RUNNER_TEMP/store.log"
