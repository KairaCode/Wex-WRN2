name: Benchmark results
description: Share the results of bench/bench.py from your machine
title: "Bench: <CPU> / <GPU> / <filesystem>"
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. Run `python3 bench/bench.py --dir /path/on/your/model/volume` (see `bench/README.md`),
        read `bench/out/results.json`, then attach it below. On Linux or macOS, `python3 -I bench/wex_io.py --dir ...` (the read
        paths for expert records) writes `bench/out/wex_io.json`: attach it here too, or alone.
  - type: textarea
    id: results
    attributes:
      label: results.json and / or wex_io.json
      description: Drag the files here, or paste their content.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command line you ran
      placeholder: python3 bench/bench.py --dir /tank/models --size-gb 16
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Other load on the machine during the run, RAID/ZFS layout, power profile, problems you hit.
